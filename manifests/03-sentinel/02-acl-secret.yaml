# ACL rules for the Valkey DATA pods only.
# Referenced from spec.valkeyReplicationConfig.acl in the ValkeySentinel CR, so the
# Sentinel pods do NOT load this file (Sentinel is protected by sentinelSecret instead).
# Do not reference it from the top-level spec.acl: on 3.5.1 that mounts the file into the
# Sentinel pods too, which breaks Sentinel-to-Sentinel authentication (no quorum).
# Naming convention is mandatory: <instance-name>-acl-secret
# For a ValkeySentinel, <instance-name> = spec.valkeyReplicationConfig.name
# Docs: https://techdocs.broadcom.com/us/en/vmware-tanzu/data-solutions/tanzu-for-valkey-on-kubernetes/3-5/valkey-on-kubernetes/configure-acl.html
#
#   default  - platform identity (operator, Sentinel, replication, exporter).
#              MUST have a password, otherwise protected mode rejects remote
#              connections ("DENIED Running in protected mode").
#   admin    - named account for human operators (auditable in ACL LOG / CLIENT LIST)
#   appuser  - least-privilege application account (only app:* keys, no admin/dangerous cmds)
#   monitor  - read-only troubleshooting account
apiVersion: v1
kind: Secret
metadata:
  name: ${REPL_NAME}-acl-secret
  namespace: ${VALKEY_NS}
type: Opaque
stringData:
  user.acl: |
    user default on >${VALKEY_DEFAULT_PASSWORD} ~* &* +@all
    user admin on >${VALKEY_ADMIN_PASSWORD} ~* &* +@all
    user appuser on >${VALKEY_APP_PASSWORD} ~app:* &* +@read +@write +@connection +@transaction -@dangerous
    user monitor on >${VALKEY_MONITOR_PASSWORD} ~* resetchannels -@all +@read +@connection +info +ping +client|list +slowlog|get +latency +memory|stats +memory|usage +config|get +dbsize +scan
