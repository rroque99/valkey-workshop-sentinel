# Credentials the PLATFORM uses to talk to Valkey:
#   - the operator heartbeat / health checks
#   - Sentinel -> Valkey authentication (sentinel auth-user / auth-pass)
#   - replica -> primary authentication
#   - the Prometheus exporter sidecar
# Referenced from spec.kubernetesConfig.valkeySecret in the ValkeySentinel CR.
# The user MUST exist in the ACL file (02-acl-secret.yaml).
apiVersion: v1
kind: Secret
metadata:
  name: ${REPL_NAME}-credentials
  namespace: ${VALKEY_NS}
type: Opaque
stringData:
  username: "default"
  password: "${VALKEY_DEFAULT_PASSWORD}"
---
# Credentials that protect the SENTINEL API (port 26379).
# Referenced from spec.valkeySentinelConfig.sentinelSecret. The operator maps it to
# requirepass, sentinel sentinel-user and sentinel sentinel-pass in sentinel.conf, so
# it is also how the Sentinels authenticate to each other (required for quorum).
# Clients authenticate to Sentinel with this password (AUTH <password>).
# This is NOT the same as valkeySecret above (Sentinel -> Valkey data nodes).
# Docs: https://techdocs.broadcom.com/us/en/vmware-tanzu/data-solutions/tanzu-for-valkey-on-kubernetes/3-5/valkey-on-kubernetes/configure-acl.html
apiVersion: v1
kind: Secret
metadata:
  name: ${SENTINEL_NAME}-sentinel-credentials
  namespace: ${VALKEY_NS}
type: Opaque
stringData:
  username: "default"
  password: "${SENTINEL_PASSWORD}"
