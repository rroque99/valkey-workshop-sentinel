# Credentials the PLATFORM uses to talk to Valkey:
#   - the operator heartbeat / health checks
#   - Sentinel -> Valkey authentication (sentinel auth-user / auth-pass)
#   - replica -> primary authentication
#   - the Prometheus exporter sidecar
# Referenced from spec.kubernetesConfig.valkeySecret in the ValkeySentinel CR.
# The user MUST exist in the ACL file (02-acl-secret.yaml).
apiVersion: v1
kind: Secret
metadata:
  name: ${REPL_NAME}-credentials
  namespace: ${VALKEY_NS}
type: Opaque
stringData:
  username: "default"
  password: "${VALKEY_DEFAULT_PASSWORD}"
