# S3 credentials used by the operator's persistence (backup/restore) container.
# Must live in the same namespace as the ValkeyBackupLocation and the instance.
apiVersion: v1
kind: Secret
metadata:
  name: valkey-backup-s3-credentials
  namespace: ${VALKEY_NS}
type: Opaque
stringData:
  accessKeyId: "valkey-backup"
  secretAccessKey: "${MINIO_ROOT_PASSWORD}"
