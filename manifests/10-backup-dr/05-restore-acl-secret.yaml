# The restore target is a NEW instance, so it needs its own ACL + credentials
# secrets following the <instance-name>-acl-secret convention.
apiVersion: v1
kind: Secret
metadata:
  name: vk-restored-acl-secret
  namespace: ${VALKEY_NS}
type: Opaque
stringData:
  user.acl: |
    user default on >${VALKEY_DEFAULT_PASSWORD} ~* &* +@all
    user admin on >${VALKEY_ADMIN_PASSWORD} ~* &* +@all
---
apiVersion: v1
kind: Secret
metadata:
  name: vk-restored-credentials
  namespace: ${VALKEY_NS}
type: Opaque
stringData:
  username: "default"
  password: "${VALKEY_DEFAULT_PASSWORD}"
