# DR "site". In a real deployment this is a namespace on a SECOND cluster
# (apply with --context $DR_CONTEXT). In a single-cluster lab it is a second namespace.
apiVersion: v1
kind: Namespace
metadata:
  name: ${DR_NS}
  labels:
    workshop: valkey-sentinel
    pod-security.kubernetes.io/warn: restricted
---
# Password the DR replicas use to authenticate to the source primary
# (masterauth -> the source "default" user).
apiVersion: v1
kind: Secret
metadata:
  name: dr-source-password
  namespace: ${DR_NS}
type: Opaque
stringData:
  password: "${VALKEY_DEFAULT_PASSWORD}"
---
apiVersion: v1
kind: Secret
metadata:
  name: vk-repl-dr-credentials
  namespace: ${DR_NS}
type: Opaque
stringData:
  username: "default"
  password: "${VALKEY_DEFAULT_PASSWORD}"
---
apiVersion: v1
kind: Secret
metadata:
  name: vk-repl-dr-acl-secret
  namespace: ${DR_NS}
type: Opaque
stringData:
  user.acl: |
    user default on >${VALKEY_DEFAULT_PASSWORD} ~* &* +@all
    user admin on >${VALKEY_ADMIN_PASSWORD} ~* &* +@all
    user appuser on >${VALKEY_APP_PASSWORD} ~app:* &* +@read +@write +@connection +@transaction -@dangerous
---
# Sentinel password for the DR ValkeySentinel (12-dr-sentinel.yaml), used after promotion.
# Same password as the primary site, so scli works with VKNS=$DR_NS.
apiVersion: v1
kind: Secret
metadata:
  name: vk-sentinel-dr-sentinel-credentials
  namespace: ${DR_NS}
type: Opaque
stringData:
  username: "default"
  password: "${SENTINEL_PASSWORD}"
