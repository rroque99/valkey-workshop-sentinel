# Credentials that protect the Sentinel API itself (port 26379).
# Mapped by the operator to requirepass / sentinel sentinel-user / sentinel sentinel-pass.
# This is NOT the same as spec.kubernetesConfig.valkeySecret, which Sentinel uses
# to log in to the monitored Valkey nodes. Mixing the two causes auth failures.
apiVersion: v1
kind: Secret
metadata:
  name: ${SENTINEL_NAME}-sentinel-credentials
  namespace: ${VALKEY_NS}
type: Opaque
stringData:
  username: "default"
  password: "${SENTINEL_PASSWORD}"
