# Credentials mounted into the workshop client pod
apiVersion: v1
kind: Secret
metadata:
  name: valkey-client-credentials
  namespace: ${VALKEY_NS}
type: Opaque
stringData:
  app-user: "appuser"
  app-password: "${VALKEY_APP_PASSWORD}"
  admin-password: "${VALKEY_ADMIN_PASSWORD}"
  sentinel-password: "${SENTINEL_PASSWORD}"
