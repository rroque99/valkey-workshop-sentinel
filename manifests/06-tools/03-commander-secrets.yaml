# Secrets for the stand-alone Valkey Commander (05-valkey-commander.yaml).

# 1. Login for the Commander web UI (username/password keys are required)
apiVersion: v1
kind: Secret
metadata:
  name: ${SENTINEL_NAME}-commander-login
  namespace: ${VALKEY_NS}
type: Opaque
stringData:
  username: "operator"
  password: "${COMMANDER_PASSWORD}"
---
# 2. The Valkey user Commander logs in to the data pods with. The user MUST
#    exist in the ACL file (03-sentinel/02-acl-secret.yaml). The human "admin"
#    user is used so the console shows up as user=admin in CLIENT LIST/ACL LOG
#    and no ACL change (which would roll the data pods) is needed.
apiVersion: v1
kind: Secret
metadata:
  name: ${SENTINEL_NAME}-commander-valkey
  namespace: ${VALKEY_NS}
type: Opaque
stringData:
  username: "admin"
  password: "${VALKEY_ADMIN_PASSWORD}"
